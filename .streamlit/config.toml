redBackgroundColor = "#fda29b33"
orangeColor = "#e98f4f"
orangeTextColor = "#ffd6af"
orangeBackgroundColor = "#e98f4f33"
yellowColor = "#fadc79"
yellowTextColor = "#fef5d0"
yellowBackgroundColor = "#fadc7933"
greenColor = "#c4ea9e"
greenTextColor = "#c4ea9e"
greenBackgroundColor = "#c4ea9e33"
blueColor = "#8fcaea"
