# SonarQube look: values from Sonar's Echoes design system (@sonarsource/echoes-react, sonar.css).
# Light and dark follow the OS setting; the app menu (top right) switches System / Light / Dark.

[server]
enableStaticServing = true  # serves static/fonts

[browser]
gatherUsageStats = false

[theme]
font = "Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
headingFont = "Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
codeFont = "'Ubuntu Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
baseFontSize = 14
codeFontSize = "0.9375rem"
headingFontSizes = ["1.5rem", "1.25rem", "1.125rem", "1rem", "0.875rem", "0.75rem"]
headingFontWeights = [600, 600, 600, 600, 700, 700]
metricValueFontSize = "1.5rem"
metricValueFontWeight = 600
baseRadius = "4px"
buttonRadius = "4px"
showWidgetBorder = true
showSidebarBorder = true

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-400.woff2"
weight = 400
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-500.woff2"
weight = 500
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-600.woff2"
weight = 600
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-700.woff2"
weight = 700
[[theme.fontFaces]]
family = "Ubuntu Mono"
url = "app/static/fonts/ubuntu-mono-400.woff2"
weight = 400
[[theme.fontFaces]]
family = "Ubuntu Mono"
url = "app/static/fonts/ubuntu-mono-700.woff2"
weight = 700

[theme.light]
primaryColor = "#5d6cd0"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#eff2f9"
textColor = "#3e4357"
linkColor = "#5d6cd0"
borderColor = "#c5cddf"
dataframeBorderColor = "#e1e6f3"
dataframeHeaderBackgroundColor = "#eff2f9"
dataframeHeaderTextColor = "#1d212f"
codeTextColor = "#1d212f"
codeBackgroundColor = "#eff2f9"
redColor = "#d92d20"
redTextColor = "#b42318"
redBackgroundColor = "#fef3f2"
orangeColor = "#dc5e03"
orangeTextColor = "#93370d"
orangeBackgroundColor = "#fff0eb"
yellowColor = "#f5b840"
yellowTextColor = "#8c5e1e"
yellowBackgroundColor = "#fcf5e4"
greenColor = "#75a92c"
greenTextColor = "#537c17"
greenBackgroundColor = "#f3f8ef"
blueColor = "#316c92"
blueTextColor = "#316c92"
blueBackgroundColor = "#f5fbff"
violetColor = "#883fdd"
violetTextColor = "#7934c7"
violetBackgroundColor = "#f4eeff"
grayColor = "#a6adc2"
grayTextColor = "#637192"
grayBackgroundColor = "#eff2f9"
chartCategoricalColors = ["#5d6cd0", "#316c92", "#75a92c", "#f5b840", "#883fdd", "#dc5e03", "#d92d20"]

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#eff2f9"

[theme.dark]
